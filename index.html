<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .completed span {
    text-decoration: line-through;
    color: #888;
}

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e60000;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        li button {
            background-color: #ccc;
            color: #333;
            padding: 5px 10px;
            font-size: 14px;
        }

        li button:hover {
            background-color: #ff4d4d;
            color: white;
        }
    </style>
</head>
<body>

    <div class="filters" style="margin-bottom: 15px;">
        <button onclick="filterTasks('all')">All</button>
        <button onclick="filterTasks('active')">Active</button>
        <button onclick="filterTasks('completed')">Completed</button>
    </div>

    <div class="container">
        <h1>My Task Manager</h1>
        <div class="input-group">
            <input type="text" id="taskTitle" placeholder="Enter a new task...">
            <button onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/tasks';
let allTasks = []; // Store tasks globally for filtering

async function fetchTasks() {
    try {
        const res = await fetch(API_URL);
        allTasks = await res.json();
        renderTasks(allTasks);
    } catch (err) {
        console.error('Failed to fetch tasks:', err);
    }
}

function renderTasks(tasksToRender) {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    
    tasksToRender.forEach(task => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');
        
        li.innerHTML = `
            <span onclick="toggleTask(${task.id}, ${task.completed})" style="cursor:pointer;">${task.title}</span>
            <button onclick="deleteTask(${task.id})">Delete</button>
        `;
        list.appendChild(li);
    });
}

function filterTasks(status) {
    if (status === 'active') {
        renderTasks(allTasks.filter(t => !t.completed));
    } else if (status === 'completed') {
        renderTasks(allTasks.filter(t => t.completed));
    } else {
        renderTasks(allTasks);
    }
}

async function addTask() {
    const input = document.getElementById('taskTitle');
    const title = input.value.trim();
    if (!title) return;

    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
        });
        input.value = '';
        fetchTasks();
    } catch (err) {
        console.error('Failed to add task:', err);
    }
}

async function toggleTask(id, currentStatus) {
    try {
        await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: !currentStatus })
        });
        fetchTasks();
    } catch (err) {
        console.error('Failed to update task:', err);
    }
}

async function deleteTask(id) {
    try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchTasks();
    } catch (err) {
        console.error('Failed to delete task:', err);
    }
}

window.onload = fetchTasks;
    </script>
</body>
</html>
